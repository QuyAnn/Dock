name: Render Control Center

on:
  pull_request:
    paths:
      - "src/ui/control_center.rs"
      - "src/ui/cc_preview.rs"
      - "src/ui/glass.rs"
      - "src/ui/popup.rs"
      - "src/ui/renderer.rs"
      - "src/ui/liquid.rs"
      - "src/ui/ccicons.rs"
      - "src/ui/svgpath.rs"
      - "src/ui/appmenu.rs"
      - "src/ui/popup_content.rs"
      - "src/ui/calendar.rs"
      - "src/ui/more_widgets.rs"
      - "src/ui/gallery.rs"
      - "src/ui/thumbnails.rs"
      - "src/ui/dock.rs"
      - "src/ui/anim.rs"
      - "src/ui/apps.rs"
      - "src/dock_preview.rs"
      - "render-inputs/**"
      - "src/main.rs"
      - "src/ui/sficons.rs"
      - "src/win/**"
      - ".github/workflows/render-control-center.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test release
        run: |
          cargo test --release
          cargo build --release
      - name: Create deterministic sample wallpapers
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force render-inputs, render-output | Out-Null
          function New-Gradient([string]$Path, [string]$Top, [string]$Bottom) {
            $bitmap = [System.Drawing.Bitmap]::new(1280, 720)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $rect = [System.Drawing.Rectangle]::new(0, 0, 1280, 720)
            $brush = [System.Drawing.Drawing2D.LinearGradientBrush]::new(
              $rect,
              [System.Drawing.ColorTranslator]::FromHtml($Top),
              [System.Drawing.ColorTranslator]::FromHtml($Bottom),
              35
            )
            $graphics.FillRectangle($brush, $rect)
            $brush.Dispose()
            $graphics.Dispose()
            $bitmap.Save($Path, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            $bitmap.Dispose()
          }
          New-Gradient "render-inputs/ocean.jpg" "#1598A5" "#063D57"
          New-Gradient "render-inputs/light.jpg" "#E9F6FF" "#8BC7E8"
          # Plain pale mint desktop (a user's real backdrop): pastel, luminance ~225-240.
          New-Gradient "render-inputs/user_mint.jpg" "#E6F2E7" "#D8E4DC"
          # A bright light-theme editor: white page, grey gutter, dark code lines long enough to run
          # under the Control Center (worst case for dark glass; show-through for the pale glass).
          $bitmap = [System.Drawing.Bitmap]::new(1280, 720)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::White)
          $graphics.FillRectangle([System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(243, 243, 243)), 0, 0, 220, 720)
          $font = [System.Drawing.Font]::new("Consolas", 11)
          $ink = @([System.Drawing.Color]::FromArgb(36, 41, 47), [System.Drawing.Color]::FromArgb(0, 92, 197), [System.Drawing.Color]::FromArgb(215, 58, 73), [System.Drawing.Color]::FromArgb(111, 66, 193))
          for ($i = 0; $i -lt 38; $i++) {
            $brush = [System.Drawing.SolidBrush]::new($ink[$i % 4])
            $graphics.DrawString(("    let value_{0} = compute(item, {1}) + offset * scale.factor(); // note: keep in sync with the table" -f $i, ($i * 7)), $font, $brush, 240, 8 + $i * 18.5)
            $brush.Dispose()
          }
          $graphics.Dispose()
          $bitmap.Save("render-inputs/white_ide.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $bitmap.Dispose()
          New-Gradient "render-inputs/dark.jpg" "#193250" "#050A13"
          # Saturated Windows-blue desktop (a user's real backdrop behind a top dock).
          New-Gradient "render-inputs/blue_desk.jpg" "#3C88F2" "#1E5CC6"
          # Mixed backdrops: dark app UI with a white browser/tab strip on top (~20%), and a variant
          # with a white band across the middle. Drawn at 2x.
          function New-Mixed([string]$Path, [int]$BandTop, [int]$BandH) {
            $bitmap = [System.Drawing.Bitmap]::new(1620, 1140)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit
            $graphics.Clear([System.Drawing.Color]::FromArgb(32, 33, 36))
            $f = [System.Drawing.Font]::new("Segoe UI", 26, [System.Drawing.GraphicsUnit]::Pixel)
            $light = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(200, 202, 206))
            $dim = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(130, 134, 140))
            $row = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(45, 46, 50))
            $green = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(46, 125, 50))
            for ($i = 0; $i -lt 16; $i++) {
              $y = 20 + $i * 72
              if ($i % 2 -eq 0) { $graphics.FillRectangle($row, 0, $y, 1620, 64) }
              $graphics.DrawString(("Xem tất cả - mục {0}: chi tiết, chuyển, tiếp tục" -f $i), $f, $light, 120, $y + 12)
              $graphics.DrawString("15/10/2026", $f, $dim, 1300, $y + 12)
            }
            $graphics.FillRectangle($green, 900, 540, 120, 60)
            $white = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(250, 250, 250))
            $tab = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(222, 225, 230))
            $ink = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(60, 64, 67))
            $graphics.FillRectangle($white, 0, $BandTop, 1620, $BandH)
            $graphics.FillRectangle($tab, 0, $BandTop, 1620, 56)
            for ($t = 0; $t -lt 6; $t++) { $graphics.DrawString(("Tab trang {0}" -f ($t + 1)), $f, $ink, 30 + $t * 270, $BandTop + 12) }
            for ($k = 0; $k -lt [Math]::Floor(($BandH - 70) / 40); $k++) {
              $graphics.DrawString("Nội dung trang web màu trắng với chữ xám đậm để kiểm tra độ đọc", $f, $ink, 60, $BandTop + 70 + $k * 40)
            }
            $graphics.Dispose()
            $bitmap.Save($Path, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            $bitmap.Dispose()
          }
          New-Mixed "render-inputs/mixed_top.jpg" 0 240
          New-Mixed "render-inputs/mixed_band.jpg" 460 260
          # A dark VS Code-like editor at 2x (~13 px code at 1x): syntax-coloured Java lines.
          $bitmap = [System.Drawing.Bitmap]::new(1620, 1140)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit
          $graphics.Clear([System.Drawing.Color]::FromArgb(30, 30, 30))
          $graphics.FillRectangle([System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(37, 37, 38)), 0, 0, 120, 1140)
          $code = [System.Drawing.Font]::new("Consolas", 26, [System.Drawing.GraphicsUnit]::Pixel)
          $cols = @([System.Drawing.Color]::FromArgb(86, 156, 214), [System.Drawing.Color]::FromArgb(220, 220, 170), [System.Drawing.Color]::FromArgb(206, 145, 120),
                    [System.Drawing.Color]::FromArgb(156, 220, 254), [System.Drawing.Color]::FromArgb(78, 201, 176), [System.Drawing.Color]::FromArgb(212, 212, 212), [System.Drawing.Color]::FromArgb(106, 153, 85))
          $parts = @("private ", "void ", "validate", "(item.getNum(), ", "ResponseCode", ".H2H_FILE_UPLOAD_17, ", "// check")
          for ($i = 0; $i -lt 30; $i++) {
            $x = 160 + ($i % 5) * 40
            for ($k = 0; $k -lt 7; $k++) {
              $t = $parts[($k + $i) % 7]
              $b = [System.Drawing.SolidBrush]::new($cols[($k + $i) % 7])
              $graphics.DrawString($t, $code, $b, $x, 14 + $i * 37)
              $x += $graphics.MeasureString($t, $code).Width - 6
              $b.Dispose()
            }
          }
          $graphics.Dispose()
          $bitmap.Save("render-inputs/dark_ide.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $bitmap.Dispose()
          # A light web page like a real browser at 100%: white page, grey nav, cards with real
          # body text, a teal image block and a blue button (drawn at 2x so text is ~14 px at 1x).
          $bitmap = [System.Drawing.Bitmap]::new(1620, 1140)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit
          $graphics.Clear([System.Drawing.Color]::White)
          $graphics.FillRectangle([System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(248, 248, 249)), 0, 0, 1620, 96)
          $graphics.FillRectangle([System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(229, 231, 235)), 0, 96, 1620, 2)
          $graphics.FillRectangle([System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(246, 247, 248)), 0, 98, 330, 1042)
          $title = [System.Drawing.Font]::new("Segoe UI Semibold", 22, [System.Drawing.GraphicsUnit]::Pixel)
          $titleBig = [System.Drawing.Font]::new("Segoe UI Semibold", 30, [System.Drawing.GraphicsUnit]::Pixel)
          $body = [System.Drawing.Font]::new("Segoe UI", 26, [System.Drawing.GraphicsUnit]::Pixel)
          $dark = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(32, 33, 36))
          $grey = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(95, 99, 104))
          $line = [System.Drawing.Pen]::new([System.Drawing.Color]::FromArgb(229, 231, 235), 2)
          $card = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(250, 250, 251))
          $teal = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(47, 111, 115))
          $blue = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(26, 115, 232))
          $graphics.DrawString("Trang chủ   Tin tức   Thể thao   Công nghệ   Giải trí   Đời sống", $title, $dark, 360, 32)
          foreach ($i in 0..13) { $graphics.DrawString(("Mục điều hướng {0}" -f ($i + 1)), $body, $grey, 36, 130 + $i * 62) }
          $texts = @("Không có gì đáng lo ngại khi cập nhật bản mới nhất,",
                     "các thay đổi đã được kiểm thử trên nhiều cấu hình máy",
                     "khác nhau và cho kết quả ổn định trong suốt tuần qua.",
                     "Xem thêm chi tiết trong phần ghi chú phát hành bên dưới.")
          for ($c = 0; $c -lt 4; $c++) {
            $y = 130 + $c * 252
            $graphics.FillRectangle($card, 370, $y, 1210, 228)
            $graphics.DrawRectangle($line, 370, $y, 1210, 228)
            $graphics.FillRectangle($teal, 392, $y + 22, 180, 184)
            $graphics.DrawString(("Bài viết nổi bật số {0}: cập nhật giao diện" -f ($c + 1)), $titleBig, $dark, 600, $y + 20)
            for ($k = 0; $k -lt 4; $k++) { $graphics.DrawString($texts[$k] + " " + $texts[($k + $c) % 4], $body, $grey, 600, $y + 70 + $k * 36) }
            if ($c -eq 1) { $graphics.FillRectangle($blue, 1180, $y + 168, 200, 44) }
          }
          $graphics.Dispose()
          $bitmap.Save("render-inputs/web_page.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $bitmap.Dispose()
      - name: Render production Control Center
        shell: pwsh
        env:
          RUST_BACKTRACE: "1"
        run: |
          $exe = (Resolve-Path ".\target\release\smartdock.exe").Path
          $failures = @()
          function Show-Logs([string]$OutPath) {
            foreach ($ext in @(".log", ".stderr.log", ".stdout.log")) {
              $p = [System.IO.Path]::ChangeExtension($OutPath, $ext)
              if (Test-Path $p) {
                Write-Host "----- $p -----"
                Get-Content $p | ForEach-Object { Write-Host $_ }
              } else {
                Write-Host "----- $p (missing) -----"
              }
            }
          }
          function Invoke-Render([string]$Output, [string]$Wallpaper, [string]$Appearance, [string]$Popup = "") {
            $outPath = [System.IO.Path]::GetFullPath($Output)
            $wallpaperPath = (Resolve-Path $Wallpaper).Path
            $stderrPath = [System.IO.Path]::ChangeExtension($outPath, ".stderr.log")
            $stdoutPath = [System.IO.Path]::ChangeExtension($outPath, ".stdout.log")
            Write-Host "Rendering $outPath from $wallpaperPath"
            $process = Start-Process -FilePath $exe `
              -ArgumentList $(if ($Popup) { @("--render-popup", $Popup, "`"$outPath`"", "`"$wallpaperPath`"", $Appearance) } else { @("--render-cc", "`"$outPath`"", "`"$wallpaperPath`"", $Appearance) }) `
              -RedirectStandardError $stderrPath `
              -RedirectStandardOutput $stdoutPath `
              -NoNewWindow -PassThru
            if (-not $process.WaitForExit(60000)) {
              $process.Kill($true)
              Show-Logs $outPath
              return "timed out: $Output"
            }
            $process.WaitForExit()
            $code = $process.ExitCode
            Write-Host ("Exit code: {0} (0x{1:X8})" -f $code, $code)
            Show-Logs $outPath
            if (Test-Path $outPath) { Write-Host "PNG size: $((Get-Item $outPath).Length) bytes" }
            if ($code -ne 0) { return "exit $code : $Output" }
            if (Test-Path $outPath) { Write-Host "PNG size: $((Get-Item $outPath).Length) bytes" }
            return $null
          }
          $renders = [ordered]@{
            "ocean" = "dark"; "light" = "light"; "dark" = "dark"; "user_desktop" = "dark"; "macos_ref" = "dark"; "dark_ui" = "dark"
          }
          foreach ($name in $renders.Keys) {
            $r = Invoke-Render "render-output\control_center_$name.png" "render-inputs\$name.jpg" $renders[$name]
            if ($r) { $failures += $r }
          }
          # Wallpaper matrix: every test backdrop in both appearances.
          foreach ($wp in @("wp_black", "wp_white", "wp_lightgrey", "wp_grey", "wp_colorful", "wp_city", "wp_sky", "wp_navy", "wp_nature", "wp_bloom",
                            "user_desktop", "macos27_replica", "white_ide", "dark_ui", "user_mint")) {
            foreach ($mode in @("light", "dark")) {
              $r = Invoke-Render "render-output\wall_${wp}_$mode.png" "render-inputs\$wp.jpg" $mode
              if ($r) { $failures += $r }
            }
          }
          foreach ($mode in @("dark", "light")) {
            $r = Invoke-Render "render-output\control_center_macos27_replica_$mode.png" "render-inputs\macos27_replica.jpg" $mode
            if ($r) { $failures += $r }
          }
          foreach ($name in @("user_desktop", "dark_ui")) {
            $r = Invoke-Render "render-output\control_center_${name}_light.png" "render-inputs\$name.jpg" "light"
            if ($r) { $failures += $r }
          }
          foreach ($mode in @("dark", "light")) {
            $r = Invoke-Render "render-output\control_center_white_ide_$mode.png" "render-inputs\white_ide.jpg" $mode
            if ($r) { $failures += $r }
            foreach ($p in @("ai", "calendar", "weather")) {
              $r = Invoke-Render "render-output\popup_${p}_white_ide_$mode.png" "render-inputs\white_ide.jpg" $mode $p
              if ($r) { $failures += $r }
            }
          }
          $env:SMARTDOCK_CC_OUTPUTS = "1"
          foreach ($name in @("dark_ui", "user_desktop")) {
            $r = Invoke-Render "render-output\cc_outputs_$name.png" "render-inputs\$name.jpg" "dark"
            if ($r) { $failures += $r }
          }
          Remove-Item Env:SMARTDOCK_CC_OUTPUTS
          # Edit Controls: edit mode, a module mid-drag, and a customized layout.
          $custom = "wifi,media,bluetooth,mic,dark,lock,sleep,brightness,volume,airplane,nightlight,focus,hotspot,clipboard,taskmanager,explorer,batterysaver"
          foreach ($wp in @("user_desktop", "white_ide")) {
            foreach ($mode in @("light", "dark")) {
              $env:SMARTDOCK_CC_EDIT = "1"
              $r = Invoke-Render "render-output\cc_edit_${wp}_$mode.png" "render-inputs\$wp.jpg" $mode
              if ($r) { $failures += $r }
              $env:SMARTDOCK_CC_DRAG = "timer,bluetooth"
              $r = Invoke-Render "render-output\cc_edit_drag_${wp}_$mode.png" "render-inputs\$wp.jpg" $mode
              if ($r) { $failures += $r }
              Remove-Item Env:SMARTDOCK_CC_DRAG
              Remove-Item Env:SMARTDOCK_CC_EDIT
              $env:SMARTDOCK_CC_MODULES = $custom
              $r = Invoke-Render "render-output\cc_custom_${wp}_$mode.png" "render-inputs\$wp.jpg" $mode
              if ($r) { $failures += $r }
              $env:SMARTDOCK_CC_EDIT = "1"
              $r = Invoke-Render "render-output\cc_custom_edit_${wp}_$mode.png" "render-inputs\$wp.jpg" $mode
              if ($r) { $failures += $r }
              Remove-Item Env:SMARTDOCK_CC_EDIT
              Remove-Item Env:SMARTDOCK_CC_MODULES
            }
          }
          # Live-path replica (SMARTDOCK_CC_LIVE=<display scale>): same capture scale, popup-local
          # backdrop and blur as the real popup on a 100% / 125% / 150% screen.
          foreach ($wp in @("web_page", "user_mint", "white_ide", "wp_white", "user_desktop")) {
            foreach ($sc in @("1", "1.25", "1.5")) {
              $env:SMARTDOCK_CC_LIVE = $sc
              $tag = $sc.Replace(".", "")
              foreach ($mode in @("light", "dark")) {
                $r = Invoke-Render "render-output\cc_live_${wp}_${mode}_$tag.png" "render-inputs\$wp.jpg" $mode
                if ($r) { $failures += $r }
              }
              Remove-Item Env:SMARTDOCK_CC_LIVE
            }
          }
          # Dark / photo / colourful backdrops through the live path at 100% and 125%.
          foreach ($wp in @("mixed_top", "mixed_band", "dark_ide", "dark_ui", "wp_black", "wp_navy", "wp_colorful", "wp_nature", "wp_city", "ocean")) {
            foreach ($sc in @("1", "1.25")) {
              $env:SMARTDOCK_CC_LIVE = $sc
              $tag = $sc.Replace(".", "")
              foreach ($mode in @("light", "dark")) {
                $r = Invoke-Render "render-output\cc_live_${wp}_${mode}_$tag.png" "render-inputs\$wp.jpg" $mode
                if ($r) { $failures += $r }
              }
              Remove-Item Env:SMARTDOCK_CC_LIVE
            }
          }
          foreach ($mode in @("light", "dark")) {
            $r = Invoke-Render "render-output\wall_web_page_$mode.png" "render-inputs\web_page.jpg" $mode
            if ($r) { $failures += $r }
          }
          $popups = @("calendar", "weather", "cpu", "ram", "media", "settings", "todo", "ai", "git", "currency", "notes",
            "stopwatch", "worldclock", "screentime", "forecast", "appmenu", "dockmenu", "gallery")
          foreach ($p in $popups) {
            foreach ($wp in @("user_desktop", "dark_ui")) {
              $r = Invoke-Render "render-output\popup_${p}_$wp.png" "render-inputs\$wp.jpg" "dark" $p
              if ($r) { $failures += $r }
            }
          }
          foreach ($p in @("calendar", "weather", "settings", "appmenu", "currency")) {
            $r = Invoke-Render "render-output\popup_${p}_light.png" "render-inputs\light.jpg" "light" $p
            if ($r) { $failures += $r }
          }
          # Non-CC popups in the Control Center clear glass through the live path (100%).
          $env:SMARTDOCK_CC_LIVE = "1"
          foreach ($wp in @("dark_ide", "web_page", "mixed_top", "wp_city")) {
            foreach ($p in @("ai", "calendar", "weather")) {
              $r = Invoke-Render "render-output\popup_live_${p}_${wp}_light.png" "render-inputs\$wp.jpg" "light" $p
              if ($r) { $failures += $r }
            }
            $r = Invoke-Render "render-output\popup_live_ai_${wp}_dark.png" "render-inputs\$wp.jpg" "dark" "ai"
            if ($r) { $failures += $r }
          }
          Remove-Item Env:SMARTDOCK_CC_LIVE
          # Dock on each screen edge (SMARTDOCK_DOCK_EDGE) with a popup opened from its tile.
          foreach ($set in @(@("calendar", "user_desktop", "dark"), @("control", "ocean", "dark"))) {
            $env:SMARTDOCK_DOCK_POPUP = $set[0]
            foreach ($edge in @("bottom", "top", "left", "right")) {
              $env:SMARTDOCK_DOCK_EDGE = $edge
              $outPath = [System.IO.Path]::GetFullPath("render-output\dock_edge_${edge}_$($set[0]).png")
              $wallpaperPath = (Resolve-Path "render-inputs\$($set[1]).jpg").Path
              Write-Host "Rendering $outPath (edge $edge, popup $($set[0]))"
              $process = Start-Process -FilePath $exe `
                -ArgumentList @("--render-dock", "`"$outPath`"", "`"$wallpaperPath`"", $set[2]) `
                -RedirectStandardError ([System.IO.Path]::ChangeExtension($outPath, ".stderr.log")) `
                -RedirectStandardOutput ([System.IO.Path]::ChangeExtension($outPath, ".stdout.log")) `
                -NoNewWindow -PassThru
              if (-not $process.WaitForExit(60000)) { $process.Kill($true); $failures += "timed out: dock $edge" }
              else {
                $process.WaitForExit()
                Show-Logs $outPath
                if ($process.ExitCode -ne 0) { $failures += "exit $($process.ExitCode) : dock $edge $($set[0])" }
              }
            }
          }
          Remove-Item Env:SMARTDOCK_DOCK_EDGE
          Remove-Item Env:SMARTDOCK_DOCK_POPUP
          # Active-app pill (SMARTDOCK_DOCK_ACTIVE = foreground fake app) on bottom and right docks.
          $env:SMARTDOCK_DOCK_ACTIVE = "1"
          $env:SMARTDOCK_DOCK_POPUP = "weather"
          foreach ($set in @(@("blue_desk", "light"), @("wp_white", "light"), @("dark_ide", "dark"), @("wp_city", "dark"))) {
            foreach ($edge in @("bottom", "top", "right")) {
              $env:SMARTDOCK_DOCK_EDGE = $edge
              $outPath = [System.IO.Path]::GetFullPath("render-output\dock_active_${edge}_$($set[0]).png")
              $wallpaperPath = (Resolve-Path "render-inputs\$($set[0]).jpg").Path
              Write-Host "Rendering $outPath (edge $edge, active app 1)"
              $process = Start-Process -FilePath $exe `
                -ArgumentList @("--render-dock", "`"$outPath`"", "`"$wallpaperPath`"", $set[1]) `
                -RedirectStandardError ([System.IO.Path]::ChangeExtension($outPath, ".stderr.log")) `
                -RedirectStandardOutput ([System.IO.Path]::ChangeExtension($outPath, ".stdout.log")) `
                -NoNewWindow -PassThru
              if (-not $process.WaitForExit(60000)) { $process.Kill($true); $failures += "timed out: dock active $edge" }
              else {
                $process.WaitForExit()
                Show-Logs $outPath
                if ($process.ExitCode -ne 0) { $failures += "exit $($process.ExitCode) : dock active $edge $($set[0])" }
              }
            }
          }
          Remove-Item Env:SMARTDOCK_DOCK_EDGE
          Remove-Item Env:SMARTDOCK_DOCK_POPUP
          Remove-Item Env:SMARTDOCK_DOCK_ACTIVE
          # Mid-hover magnification and active-pill grow-in (strip renders for review).
          $env:SMARTDOCK_DOCK_MAG = "1"
          $env:SMARTDOCK_DOCK_SCALE = "1"
          foreach ($edge in @("bottom", "right")) {
            $env:SMARTDOCK_DOCK_EDGE = $edge
            $outPath = [System.IO.Path]::GetFullPath("render-output\dock_mag_mid_${edge}.png")
            $wallpaperPath = (Resolve-Path "render-inputs\blue_desk.jpg").Path
            Write-Host "Rendering $outPath (edge $edge, mag mid-hover)"
            $process = Start-Process -FilePath $exe `
              -ArgumentList @("--render-dock", "`"$outPath`"", "`"$wallpaperPath`"", "light") `
              -RedirectStandardError ([System.IO.Path]::ChangeExtension($outPath, ".stderr.log")) `
              -RedirectStandardOutput ([System.IO.Path]::ChangeExtension($outPath, ".stdout.log")) `
              -NoNewWindow -PassThru
            if (-not $process.WaitForExit(60000)) { $process.Kill($true); $failures += "timed out: dock mag $edge" }
            else {
              $process.WaitForExit()
              Show-Logs $outPath
              if ($process.ExitCode -ne 0) { $failures += "exit $($process.ExitCode) : dock mag $edge" }
            }
          }
          Remove-Item Env:SMARTDOCK_DOCK_MAG
          Remove-Item Env:SMARTDOCK_DOCK_SCALE
          $env:SMARTDOCK_DOCK_ACTIVE_ANIM = "1"
          $env:SMARTDOCK_DOCK_SCALE = "1"
          foreach ($edge in @("bottom", "left")) {
            $env:SMARTDOCK_DOCK_EDGE = $edge
            $outPath = [System.IO.Path]::GetFullPath("render-output\dock_active_anim_${edge}.png")
            $wallpaperPath = (Resolve-Path "render-inputs\wp_white.jpg").Path
            Write-Host "Rendering $outPath (edge $edge, active pill mid grow-in)"
            $process = Start-Process -FilePath $exe `
              -ArgumentList @("--render-dock", "`"$outPath`"", "`"$wallpaperPath`"", "light") `
              -RedirectStandardError ([System.IO.Path]::ChangeExtension($outPath, ".stderr.log")) `
              -RedirectStandardOutput ([System.IO.Path]::ChangeExtension($outPath, ".stdout.log")) `
              -NoNewWindow -PassThru
            if (-not $process.WaitForExit(60000)) { $process.Kill($true); $failures += "timed out: dock active anim $edge" }
            else {
              $process.WaitForExit()
              Show-Logs $outPath
              if ($process.ExitCode -ne 0) { $failures += "exit $($process.ExitCode) : dock active anim $edge" }
            }
          }
          Remove-Item Env:SMARTDOCK_DOCK_ACTIVE_ANIM
          Remove-Item Env:SMARTDOCK_DOCK_SCALE
          # Git tile with sample data: dock strip only at 100% and 150%, dark and light backdrops,
          # bottom and right (vertical) docks.
          $env:SMARTDOCK_DOCK_GIT = "1"
          foreach ($set in @(@("dark_ide", "dark"), @("wp_white", "light"), @("blue_desk", "light"))) {
            foreach ($edge in @("bottom", "right")) {
              foreach ($scale in @("1", "1.5")) {
                $env:SMARTDOCK_DOCK_EDGE = $edge
                $env:SMARTDOCK_DOCK_SCALE = $scale
                $tag = if ($scale -eq "1") { "100" } else { "150" }
                $outPath = [System.IO.Path]::GetFullPath("render-output\git_tile_${edge}_$($set[0])_$tag.png")
                $wallpaperPath = (Resolve-Path "render-inputs\$($set[0]).jpg").Path
                Write-Host "Rendering $outPath (git tile, edge $edge, scale $scale)"
                $process = Start-Process -FilePath $exe `
                  -ArgumentList @("--render-dock", "`"$outPath`"", "`"$wallpaperPath`"", $set[1]) `
                  -RedirectStandardError ([System.IO.Path]::ChangeExtension($outPath, ".stderr.log")) `
                  -RedirectStandardOutput ([System.IO.Path]::ChangeExtension($outPath, ".stdout.log")) `
                  -NoNewWindow -PassThru
                if (-not $process.WaitForExit(60000)) { $process.Kill($true); $failures += "timed out: git tile $edge $scale" }
                else {
                  $process.WaitForExit()
                  Show-Logs $outPath
                  if ($process.ExitCode -ne 0) { $failures += "exit $($process.ExitCode) : git tile $edge $($set[0]) $scale" }
                }
              }
            }
          }
          Remove-Item Env:SMARTDOCK_DOCK_EDGE
          Remove-Item Env:SMARTDOCK_DOCK_SCALE
          Remove-Item Env:SMARTDOCK_DOCK_GIT
          $icons = [System.IO.Path]::GetFullPath("render-output\icons_sheet.png")
          $process = Start-Process -FilePath $exe -ArgumentList @("--render-icons", "`"$icons`"") -NoNewWindow -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill($true); $failures += "timed out: icons" }
          elseif ($process.WaitForExit() -or $process.ExitCode -ne 0) { Show-Logs $icons; $failures += "exit $($process.ExitCode) : icons" }
          if ($failures.Count -gt 0) { throw "Render failures: $($failures -join '; ')" }
      - name: Validate rendered PNGs
        shell: pwsh
        run: |
          $expected = @(
            "render-output\control_center_ocean.png",
            "render-output\control_center_light.png",
            "render-output\control_center_dark.png",
            "render-output\control_center_user_desktop.png",
            "render-output\control_center_macos_ref.png",
            "render-output\control_center_dark_ui.png",
            "render-output\icons_sheet.png"
          )
          $expected += Get-ChildItem "render-output\popup_*.png" | ForEach-Object { $_.FullName }
          if (@(Get-ChildItem "render-output\popup_*.png").Count -lt 41) { throw "Missing popup renders" }
          $expected += Get-ChildItem "render-output\cc_*.png" | ForEach-Object { $_.FullName }
          if (@(Get-ChildItem "render-output\dock_edge_*.png").Count -lt 8) { throw "Missing dock edge renders" }
          $expected += Get-ChildItem "render-output\dock_edge_*.png" | ForEach-Object { $_.FullName }
          if (@(Get-ChildItem "render-output\popup_live_*.png").Count -lt 16) { throw "Missing live popup renders" }
          if (@(Get-ChildItem "render-output\dock_active_*.png").Count -lt 12) { throw "Missing dock active renders" }
          $expected += Get-ChildItem "render-output\dock_active_*.png" | ForEach-Object { $_.FullName }
          if (@(Get-ChildItem "render-output\git_tile_*.png").Count -lt 12) { throw "Missing git tile renders" }
          if (@(Get-ChildItem "render-output\cc_edit*.png").Count -lt 8 -or @(Get-ChildItem "render-output\cc_custom*.png").Count -lt 8) { throw "Missing Edit Controls renders" }
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) { throw "Missing render: $path" }
            $file = Get-Item $path
            if ($file.Length -lt 10KB) {
              throw "Render is too small ($($file.Length) bytes): $path"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: control-center-renders
          path: render-output/*.png
          if-no-files-found: error
